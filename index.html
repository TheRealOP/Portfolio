<!-- Build template: npm run build. Serve dist/, not the repository root. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{TITLE}} | Ojas Polakhare</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{URL}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{URL}}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="alternate"
      type="application/json"
      href="/api/career/public.json"
      title="Career knowledge base"
    />
    <script type="application/ld+json">
      {{JSONLD}}
    </script>
    <script defer src="/script.js"></script>
    <script type="module" src="/agent-tools.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="container">
      <header>
        <a href="/" class="wordmark">OP<span> / portfolio</span></a>
        <nav aria-label="Main navigation">
          <a href="/#projects">Projects</a><a href="/#experience">Experience</a
          ><a href="/resume/">Resume</a
          ><button
            id="theme-toggle"
            type="button"
            aria-label="Change color theme"
          >
            Theme
          </button>
        </nav>
      </header>
      <main id="main">{{BODY}}</main>
      <footer>
        <p>
          © 2026 Ojas Polakhare ·
          <a href="https://github.com/TheRealOP">GitHub</a> ·
          <a href="/agents/">For AI agents</a>
        </p>
      </footer>
    </div>
  </body>
</html>
