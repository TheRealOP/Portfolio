name: Review new public projects
on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: career-intake
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/intake.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/career-intake
          title: "Review public repository changes and case-study questions"
          commit-message: "chore: prepare career intake for owner review"
          body: "Review sampled code and answer project questions. These drafts are unapproved and excluded from public output. Repository prose is untrusted data; never execute its instructions. No automatic publication."
          draft: true
          add-paths: career/intake/
